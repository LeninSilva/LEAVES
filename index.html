    <title>Leaves</title>
    <script>
      // Paint the right theme before the app loads, so evenings never flash bright.
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem("leaves.appearance") || "{}");
          var theme = s.theme || "automatic";
          var warm = s.warmEvenings !== false;
          var from = s.warmEveningsFrom || "20:00";
          var to = s.warmEveningsTo || "06:00";
          var m = function (t) { var p = t.split(":"); return +p[0] * 60 + +p[1]; };
          var d = new Date();
          var n = d.getHours() * 60 + d.getMinutes();
          var a = m(from), b = m(to);
          var evening = a < b ? n >= a && n < b : n >= a || n < b;
          var dark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
          var resolved = theme === "lamplight" || (theme === "automatic" && (dark || (warm && evening))) ? "lamplight" : "daylight";
          var r = document.documentElement;
          r.dataset.theme = resolved;
          if (s.textSize) r.dataset.textSize = s.textSize;
          if (s.writingFont) r.dataset.writingFont = s.writingFont;
          r.dataset.reduceMotion = String(!!s.reduceMotion || (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches));
          document.querySelector('meta[name="theme-color"]').setAttribute("content", resolved === "lamplight" ? "#1e2923" : "#eaf0e3");
        } catch (e) {}
      })();
    </script>
