name: Build Android APK

on:
  push:
    branches: [claude/leaves-journaling-app-bb1li5]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets

      - name: Init Capacitor app
        run: npx cap init "Leaves" io.github.leninsilva.leaves --web-dir=dist

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icon from the app's own artwork
        run: |
          mkdir -p resources
          cp public/icons/icon-512.png resources/icon.png
          npx capacitor-assets generate --android --iconBackgroundColor '#eaf0e3'

      - name: Harden Android manifest
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:allowBackup="true"/android:allowBackup="false"/' "$M"
          grep -q 'android:allowBackup' "$M" || sed -i 's/<application/<application android:allowBackup="false"/' "$M"
          grep -o 'android:allowBackup="[^"]*"' "$M"

      - name: Fix Kotlin stdlib duplicates
        run: |
          cat >> android/app/build.gradle << 'EOF'

          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF

      - name: Sync web app
        run: npx cap sync

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: leaves-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
